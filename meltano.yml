send_anonymous_usage_stats: true
project_id: "tap-databricks"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-databricks"
    namespace: "tap_databricks"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: api_url
      label: Workspace URL
      description: Databricks workspace URL (e.g. https://dbc-xxxx.cloud.databricks.com)

    - name: client_id
      label: Client ID
      description: OAuth client ID for the service principal
      sensitive: true

    - name: client_secret
      label: Client Secret
      description: OAuth client secret for the service principal
      sensitive: true

    - name: http_path
      label: Databricks http path
      description: Databricks http path to use for the sync (e.g. /sql/1.0/warehouses/warehouse_id)

    - name: oauth_scope
      label: OAuth Scope
      description: OAuth scope for the service principal (typically all-apis)
      value: all-apis

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Earliest replication key value for incremental streams

    - name: tables
      label: Tables
      description: Comma-separated fully qualified tables (catalog.schema.table,...)

    - name: catalog
      label: Catalog
      description: Unity Catalog name to limit discovery

    - name: schema
      label: Schema
      description: Schema name to limit discovery (used with catalog)

    - name: table_selection
      kind: array
      label: Table Selection
      description: Per-table config when using catalog and schema (name, replication_key)

    settings_group_validation:
    - [api_url, client_id, client_secret, http_path]

    config:
      oauth_scope: all-apis
      start_date: "2000-01-01T00:00:00Z"

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
